name: ingest

# Reading six RSS feeds is a job of a few dozen seconds per hour. It does not
# justify an always-on worker, and an always-on worker is exactly what nobody
# gives away for free.
on:
  schedule:
    # Two slots an hour, not because the corpus needs it but because GitHub does
    # not deliver one. Measured over 31 runs of a single hourly cron: median gap
    # of 96 minutes, worst of 221, and only 9 of 30 gaps inside 70 minutes. A
    # schedule here is best effort and the queue is dropped under load, so more
    # scheduled events mean more chances one of them fires.
    #
    # It costs nothing to try twice. The run is idempotent, dedup happens on
    # `url UNIQUE`, and a pass that finds nothing new writes nothing and exits
    # in about thirty seconds. The repository is public, so Actions minutes are
    # free.
    #
    # Off the round minutes on purpose: every scheduled job in the world fires
    # at :00, and that is exactly when the queue is worst.
    - cron: "17,47 * * * *"
  workflow_dispatch:

# A slow run must not overlap the next hour's and double-count the corpus.
concurrency:
  group: corpus-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # spaCy and the Portuguese model are pinned in uv.lock, so this restores
      # from cache instead of downloading the model on every run.
      - name: Install dependencies
        run: uv sync --group ingest --frozen

      - name: Run the ingestion
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # The vector arithmetic lives under src/ because that is what the
          # Worker bundles, and this job has to weigh a cluster exactly the way
          # a request will. One definition, reached from both sides.
          PYTHONPATH: src
        run: uv run --group ingest python -m ingest.pipeline
