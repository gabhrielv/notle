[project]
name = "notle"
version = "0.1.0"
description = "Agregador de noticias com feed personalizado e explicavel"
requires-python = ">=3.12"
# The Worker bundle carries nothing, and that is enforced by the platform, not
# by taste: a Python Worker gets 1000ms of startup CPU and importing FastAPI
# alone costs 1710ms, so the deploy is rejected. Everything the API needs is in
# the standard library. Everything heavy (spaCy, feedparser) belongs to the
# ingestion job, declared below, and runs in GitHub Actions.
dependencies = []

[dependency-groups]
# Runs only inside GitHub Actions. Never reaches the Worker bundle.
ingest = [
    "feedparser>=6.0.11",
    "spacy>=3.8.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    # Pinned as a dependency rather than fetched by `spacy download`, so the
    # model version is locked and CI needs no extra step.
    "pt-core-news-sm",
    # spaCy 3.8 still does `from click import NoSuchOption` in its CLI, and
    # `import spacy` reaches the CLI through spacy/__init__.py. typer dropped
    # click as a dependency in 0.27, so nothing pulls it in any more and even
    # `spacy.load` dies. Declared here until spaCy catches up.
    "click>=8.0.0",
]

dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
pt-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
# src/ holds what the Worker bundles; the repo root holds the ingestion job.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
