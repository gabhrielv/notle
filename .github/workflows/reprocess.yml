name: reprocess

# Só à mão. Re-lematiza o acervo inteiro e reescreve dezenas de milhares de
# linhas para consertar algo que só muda quando alguém edita uma lista de
# descarte. Não há agenda porque não há evento periódico que o justifique.
#
# Rodar depois de mexer em CHROME, LIGHT_VERBS, REPORTING_VERBS ou nos nomes das
# fontes. Até rodar, `article_terms` guarda o que o normalizador decidiu na
# chegada e discorda do código que o lê.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só contar, sem escrever"
        type: boolean
        default: true

concurrency:
  # A ingestão horária escreve nas mesmas tabelas. Duas passadas ao mesmo tempo
  # deixariam terms.doc_count contando um corpus que nenhuma das duas viu.
  group: corpus-write
  cancel-in-progress: false

jobs:
  reprocess:
    runs-on: ubuntu-latest
    # O teto tem que ficar à frente do acervo, e ele não estava. As passadas de
    # escrita foram de 30 min, depois 46, depois 53m51s contra este limite de 60,
    # porque o custo cresce com o corpus e o corpus só cresce.
    #
    # O lugar ruim de ser interrompido é específico: `recount` apaga `terms` e
    # reinsere em lotes, no fim da execução. Cortada ali, a tabela fica
    # parcialmente populada e o IDF sai errado para o acervo inteiro, o que o
    # feed serve sem nada na tela dizendo que a régua quebrou.
    #
    # Medido de onde o tempo vem: a passada de spaCy sobre 5903 artigos leva
    # 1m26s, e todo o resto são as escritas no D1. Então o teto acompanha o
    # número de linhas escritas, não o modelo de linguagem.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group ingest --frozen

      - name: Reprocess
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PYTHONPATH: src
        run: |
          uv run --group ingest python -m scripts.reprocess_terms \
            ${{ inputs.dry_run && '--dry-run' || '' }}
