name: deploy

# Deploy por commit, não por memória de quem tem o wrangler instalado.
#
# Roda a suíte antes de subir qualquer coisa. Um Worker com o ranking quebrado
# no ar é pior que um deploy que não aconteceu, e a suíte é o que separa os
# dois.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --group ingest --group dev --frozen
          pnpm install --frozen-lockfile

      - name: Test
        run: uv run --group ingest --group dev python -m pytest -q

      - name: Lint
        run: |
          uv run --group ingest --group dev ruff check src ingest scripts sim tests
          pnpm --dir web lint

      # Antes do deploy, para que o Worker novo nunca encontre um schema velho.
      # A ordem inversa é a que produz erro de coluna inexistente em produção.
      - name: Apply migrations
        run: pnpm exec wrangler d1 migrations apply notle --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build the front
        run: pnpm --dir web build

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
